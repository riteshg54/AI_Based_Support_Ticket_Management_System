<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportAI Login</title><link rel="stylesheet" href="style.css"></head><body class="auth"><div class="auth-card"><h1>Support<span>AI</span></h1><p>Sign in to your support workspace</p><div id="error"></div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p>Customer? <a href="#" onclick="register();return false">Create an account</a></p><small>Demo admin: admin@supportai.local / Admin@12345</small></div><script>const API="http://127.0.0.1:8000";async function login(){const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.detail;return}localStorage.setItem("token",d.access_token);localStorage.setItem("user",JSON.stringify(d.user));location.href="index.html"}async function register(){const name=prompt("Your name");if(!name)return;const r=await fetch(API+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email:email.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.detail;return}alert("Account created. Now sign in.")}</script></body></html>
